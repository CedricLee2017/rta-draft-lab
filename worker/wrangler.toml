#:schema node_modules/wrangler/config-schema.json
name = "rta-draft-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Browser Rendering（雲端 Chrome）。免費方案 10 分鐘/天。
[browser]
binding = "BROWSER"

[[kv_namespaces]]
binding = "MATCHES"
id = "47c4f3e6931c4992b8a743cbdb8aff56"

[vars]
# 允許的來源，逗號分隔；"*" 代表全部（公開唯讀資料，可接受）
ALLOWED_ORIGINS = "*"

[observability]
enabled = true

# 不做任何自動抓取：移除 cron（每天預熱），只有使用者手動按「抓取」才會開瀏覽器。
# 需要恢復每日預熱時，再把 [triggers] 加回來並設定 WARM_PLAYERS。
