#:schema node_modules/wrangler/config-schema.json
name = "rta-draft-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Browser Rendering（雲端 Chrome）。免費方案 10 分鐘/天。
[browser]
binding = "BROWSER"

[[kv_namespaces]]
binding = "MATCHES"
id = "47c4f3e6931c4992b8a743cbdb8aff56"

[vars]
# 允許的來源，逗號分隔；"*" 代表全部（公開唯讀資料，可接受）
ALLOWED_ORIGINS = "*"
# 每日 cron 預熱清單，格式 "playerId:season,playerId:season"
# 只預熱使用者最常看的玩家，避免浪費免費方案的瀏覽器分鐘數
WARM_PLAYERS = "221145:39"

[observability]
enabled = true

# 每天 09:17 UTC 預熱（台灣時間 17:17，約在賽季活躍時段之前）
[triggers]
crons = ["17 9 * * *"]
